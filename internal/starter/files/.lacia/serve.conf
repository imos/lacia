# ここには、プロファイルの表示名や予定の連携など、記録のリポジトリーで管理する設定を書きます。
# サーバーが待ち受けるアドレスや起動するコマンドは、lacia setup が作る端末の設定
# （~/.lacia/config/lacia.conf）に書いてください。

label = レイシア

# lacia init は、予定を読むGoogleアカウントを .lacia/calendars.json に登録します。
# カレンダーを追加したり変更したりするときは、このファイルを編集してください。

# 連携に使う OAuth のクライアントは、Web の「予定の連携」のページで入力します。組織が用意した
# クライアントを使うときは、lacia setup に --google-client-id と --google-client-secret を渡します。
