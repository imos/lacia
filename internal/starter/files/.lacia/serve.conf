# このリポジトリーのレイシアの設定です。書けるのは、プロファイルの表示名や予定の連携など、
# 記録の側に任せてよいものだけです。待ち受けるアドレスや、起動するコマンドは、
# lacia setup が作る、端末の設定（~/.lacia/config/lacia.conf）に書きます。

label = レイシア

# Google Calendar の予定を読むカレンダーは、lacia init が .lacia/calendars.json に書きます。
# 足したり変えたりするときは、そのファイルを直します。

# 連携に使う OAuth のクライアントは、Web の「予定の連携」のページで入力します。組織が用意した
# クライアントを使うときは、lacia setup に --google-client-id と --google-client-secret を渡します。
